<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Unifor - Trabalho Final</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, sans-serif;
        color: #102033;
        background: linear-gradient(135deg, #eaf4ff, #ffffff);
      }

      main {
        width: min(90vw, 720px);
        padding: 48px;
        border-radius: 24px;
        background: #ffffff;
        box-shadow: 0 24px 80px rgba(16, 32, 51, 0.12);
      }

      h1 {
        margin-top: 0;
        color: #0057b8;
      }

      p {
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Trabalho Final Integrador</h1>
      <p>Instancia EC2 provisionada com Terraform na AWS Sao Paulo.</p>
      <p>Servidor configurado via AWS Systems Manager e pagina publicada em NGINX.</p>
    </main>
  </body>
</html>
