name: Deploy demonstrativo
on:
  workflow_dispatch:
    inputs:
      target:
        description: Infrastructure target
        required: true
        type: choice
        options: [ec2-dev, ec2-prod, eks-demo]
      action:
        description: Terraform action
        required: true
        type: choice
        options: [plan, apply, destroy]
      confirm_destroy:
        description: Type DESTROY for destroy
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: infra-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
      - run: go test ./...
        working-directory: app
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive terraform
      - uses: azure/setup-helm@v4
        with:
          version: v3.17.3
      - run: helm lint helm/web-app
      - uses: terraform-linters/setup-tflint@v4
      - run: |
          for dir in terraform terraform/bootstrap terraform/eks; do
            tflint --chdir "$dir" --init
            tflint --chdir "$dir"
          done
      - name: Checkov
        run: |
          pip install checkov
          checkov -d terraform --framework terraform
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml

  plan:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: sa-east-1
      - name: Select root and guard destruction
        env:
          TARGET: ${{ inputs.target }}
          ACTION: ${{ inputs.action }}
          CONFIRM: ${{ inputs.confirm_destroy }}
        run: |
          if [ "$ACTION" = destroy ] && [ "$CONFIRM" != DESTROY ]; then
            printf 'Destroy requires confirm_destroy=DESTROY\n' >&2
            exit 1
          fi
          case "$TARGET" in
            ec2-dev) ROOT=terraform; KEY=trabalho-final/terraform.tfstate; TFVARS=env/dev.tfvars.example ;;
            ec2-prod) ROOT=terraform; KEY=ec2/prod/terraform.tfstate; TFVARS=env/prod.tfvars.example ;;
            eks-demo) ROOT=terraform/eks; KEY=eks-demo/terraform.tfstate ;;
            *) exit 1 ;;
          esac
          printf 'ROOT=%s\nKEY=%s\nTFVARS=%s\nTF_DATA_DIR=%s\n' \
            "$ROOT" "$KEY" "$TFVARS" "$RUNNER_TEMP/terraform-$TARGET" >> "$GITHUB_ENV"
      - name: Terraform init and validate
        env:
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
        run: |
          : "${STATE_BUCKET:?Configure STATE_BUCKET repository variable}"
          terraform -chdir="$ROOT" init -reconfigure -input=false \
            -backend-config="bucket=$STATE_BUCKET" -backend-config="key=$KEY" -backend-config="region=sa-east-1"
          terraform -chdir="$ROOT" fmt -check
          terraform -chdir="$ROOT" validate
      - name: Terraform plan
        env:
          ACTION: ${{ inputs.action }}
          TF_VAR_kubernetes_version: ${{ vars.EKS_KUBERNETES_VERSION }}
          TF_VAR_allowed_api_cidrs: ${{ vars.EKS_ALLOWED_API_CIDRS }}
          TF_VAR_availability_zones: ${{ vars.EKS_AVAILABILITY_ZONES }}
        run: |
          VAR_FILE=()
          if [ -n "$TFVARS" ]; then VAR_FILE=("-var-file=$TFVARS"); fi
          if [ "$ACTION" = destroy ]; then
            terraform -chdir="$ROOT" plan "${VAR_FILE[@]}" -destroy -out=plan.tfplan
          else
            terraform -chdir="$ROOT" plan "${VAR_FILE[@]}" -out=plan.tfplan
          fi
          terraform -chdir="$ROOT" show -no-color plan.tfplan > "$RUNNER_TEMP/plan.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ inputs.target }}
          path: |
            ${{ env.ROOT }}/plan.tfplan
          retention-days: 1

  apply:
    if: ${{ inputs.action != 'plan' }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: ${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: sa-east-1
      - uses: actions/download-artifact@v4
        with:
          name: terraform-plan-${{ inputs.target }}
      - name: Terraform apply approved plan
        env:
          TARGET: ${{ inputs.target }}
          STATE_BUCKET: ${{ vars.STATE_BUCKET }}
        run: |
          case "$TARGET" in
            ec2-dev) ROOT=terraform; KEY=trabalho-final/terraform.tfstate ;;
            ec2-prod) ROOT=terraform; KEY=ec2/prod/terraform.tfstate ;;
            eks-demo) ROOT=terraform/eks; KEY=eks-demo/terraform.tfstate ;;
          esac
          export TF_DATA_DIR="$RUNNER_TEMP/terraform-$TARGET"
          terraform -chdir="$ROOT" init -reconfigure -input=false \
            -backend-config="bucket=$STATE_BUCKET" -backend-config="key=$KEY" -backend-config="region=sa-east-1"
          terraform -chdir="$ROOT" apply -input=false "${GITHUB_WORKSPACE}/plan.tfplan"
          printf 'ROOT=%s\n' "$ROOT" >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        if: ${{ inputs.action == 'apply' && inputs.target != 'eks-demo' }}
        with:
          go-version-file: app/go.mod
      - name: Deploy EC2 through Ansible SSM
        if: ${{ inputs.action == 'apply' && inputs.target != 'eks-demo' }}
        env:
          ANSIBLE_SSM_BUCKET: ${{ vars.ANSIBLE_SSM_BUCKET }}
          AWS_REGION: sa-east-1
        run: |
          : "${ANSIBLE_SSM_BUCKET:?Configure dedicated unversioned transfer bucket}"
          pip install ansible-core boto3 botocore
          ansible-galaxy collection install -r ansible/requirements.yml
          curl -fsSL https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb -o "$RUNNER_TEMP/session-manager-plugin.deb"
          sudo dpkg -i "$RUNNER_TEMP/session-manager-plugin.deb"
          command -v session-manager-plugin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go -C app build -o server-linux-amd64 ./cmd/server
          TERRAFORM_DIR="${GITHUB_WORKSPACE}/${ROOT}" ./scripts/generate-inventory.sh
          ansible-playbook -i ansible/inventory.ini ansible/playbook.yml
          curl --fail --retry 12 --retry-delay 5 "$(terraform -chdir="$ROOT" output -raw public_url)/ready"
      - uses: actions/setup-go@v5
        if: ${{ inputs.action == 'apply' && inputs.target == 'eks-demo' }}
        with:
          go-version-file: app/go.mod
      - uses: azure/setup-helm@v4
        if: ${{ inputs.action == 'apply' && inputs.target == 'eks-demo' }}
        with:
          version: v3.17.3
      - name: Deploy EKS through Helm
        if: ${{ inputs.action == 'apply' && inputs.target == 'eks-demo' }}
        run: |
          CLUSTER="$(terraform -chdir=terraform/eks output -raw cluster_name)"
          REPOSITORY="$(terraform -chdir=terraform/eks output -raw ecr_repository_url)"
          REGISTRY="${REPOSITORY%%/*}"
          TAG="${GITHUB_SHA}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          docker build --build-arg "VERSION=$TAG" -t "$REPOSITORY:$TAG" app
          docker push "$REPOSITORY:$TAG"
          aws eks update-kubeconfig --name "$CLUSTER" --region sa-east-1
          helm lint helm/web-app
          helm upgrade --install web-app helm/web-app --namespace web-app --create-namespace \
            --set "image.repository=$REPOSITORY" --set "image.tag=$TAG" \
            --wait --atomic --timeout 10m
          kubectl -n web-app rollout status deployment/web-app --timeout=10m
