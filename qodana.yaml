version: "1.0"

profile:
  name: qodana.recommended

# Linter JVM Community cobre YAML, Markdown e Shell neste repositorio.
# Terraform segue validado pela pipeline de deploy com terraform validate/plan.
linter: jetbrains/qodana-jvm-community:2026.2

# Evita bloquear a entrega por avisos menores, mas falha se houver muitos problemas.
failThreshold: 50

exclude:
  - name: All
    paths:
      - .terraform
      - bootstrap/.terraform
      - terraform/.terraform
